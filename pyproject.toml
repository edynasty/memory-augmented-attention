[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-augmented-attention"
version = "0.1.0"
description = "Unified Memory-Augmented Attention: treating sequence tokens and historical KV as a single timestamped memory bank"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
